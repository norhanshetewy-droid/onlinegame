<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Algorithm Challenge</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111936,#24124f,#102f4f);color:#fff;min-height:100vh}
button{font:inherit}.app{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:25px;font-weight:800}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#ffffff16;border:1px solid #ffffff25;padding:9px 13px;border-radius:20px}
.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:70px 20px}.robot{font-size:80px;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
h1{font-size:clamp(38px,7vw,68px);margin:10px 0;background:linear-gradient(90deg,#66e3ff,#c58cff,#ff82c9);-webkit-background-clip:text;color:transparent}
.subtitle{font-size:19px;color:#d7d9ef;max-width:680px;margin:0 auto 28px}.btn{border:0;border-radius:15px;padding:14px 22px;background:linear-gradient(90deg,#5ee7ff,#9d75ff);color:#08101f;font-weight:800;cursor:pointer;box-shadow:0 8px 25px #0005}.btn:hover{transform:translateY(-2px)}
.card{background:#ffffff0d;border:1px solid #ffffff20;border-radius:24px;padding:26px;box-shadow:0 20px 50px #0003;backdrop-filter:blur(8px);margin-top:25px}
.levelbar{display:flex;gap:8px;margin:20px 0}.dot{height:8px;flex:1;border-radius:8px;background:#ffffff22}.dot.done{background:#66e3ff}.dot.now{background:#b783ff}
.question{font-size:26px;line-height:1.3;margin:18px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.opt{padding:17px;border-radius:15px;border:1px solid #ffffff22;background:#ffffff0b;color:white;text-align:left;cursor:pointer}.opt:hover{background:#ffffff18}.correct{background:#176b4b!important;border-color:#59e6ad!important}.wrong{background:#7a2940!important;border-color:#ff7898!important}
.feedback{min-height:32px;margin:18px 0;font-weight:700}.progress{height:9px;background:#ffffff18;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#55e7ff,#bd7cff);width:0;transition:.3s}
.result{text-align:center;padding:45px 20px}.score{font-size:62px;font-weight:900}.stars{font-size:42px;letter-spacing:5px}
.dragarea{display:grid;gap:9px;max-width:650px;margin:auto}.step{padding:14px;background:#ffffff0c;border:1px solid #ffffff25;border-radius:13px;cursor:grab}.step.selected{outline:2px solid #77ddff}
.loopbox{display:flex;align-items:center;justify-content:center;gap:18px;font-size:24px;margin:25px}.num{font-size:55px;font-weight:900}.small{color:#c7cbe2}
@media(max-width:650px){.options{grid-template-columns:1fr}.question{font-size:21px}.hero{padding-top:35px}.app{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">🤖 AI ALGORITHM CHALLENGE</div>
    <div class="stats"><span class="pill">⭐ <b id="score">0</b></span><span class="pill">⏱ <b id="timer">30</b>s</span></div>
  </div>

  <section id="home" class="screen active">
    <div class="hero">
      <div class="robot">🤖</div>
      <h1>AI Algorithm Challenge</h1>
      <p class="subtitle">Master algorithms, AI decisions, data patterns, and responsible AI thinking through five interactive levels.</p>
      <button class="btn" onclick="startGame()">START MISSION 🚀</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="levelbar" id="levelbar"></div>
    <div class="card">
      <div class="small" id="levelTitle"></div>
      <div class="progress"><div id="progress"></div></div>
      <div class="question" id="question"></div>
      <div id="play"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn" id="next" onclick="nextQuestion()" style="display:none">NEXT ➜</button>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="result card">
      <div class="robot">🏆</div><h1>MISSION COMPLETE!</h1>
      <div class="score" id="finalScore">0</div>
      <div class="stars" id="stars">☆☆☆</div>
      <h2 id="rank"></h2><p id="message"></p>
      <button class="btn" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
  </section>
</div>

<script>
const levels=[
{title:"LEVEL 1 — BUILD THE ALGORITHM",type:"order",items:[
 ["Start","Start the task"],["Collect data","Gather useful examples"],["Find patterns","Look for repeated patterns"],["Make a decision","Use the learned pattern to decide"]]},
{title:"LEVEL 2 — ALGORITHM HUNTER",type:"mc",qs:[
 ["A video app suggests videos based on what you watched. What is the key idea?","Learning patterns from data",["Learning patterns from data","A fixed timer","Random guessing","Turning off the computer"]],
 ["A regular program follows exact instructions. AI is different because it can…","learn patterns from examples",["learn patterns from examples","never make mistakes","ignore data","only use multiplication"]],
 ["Why can an AI prediction be wrong?","Its prediction is based on learned examples",["Its prediction is based on learned examples","AI never uses data","Algorithms cannot process information","Computers cannot store data"]]]},
{title:"LEVEL 3 — LOOP FACTORY",type:"loop",qs:[
 ["A robot must repeat “Move forward” 5 times. How many moves?","5",[3,4,5,6]],
 ["A loop repeats an action 8 times. How many executions happen?","8",[6,7,8,9]],
 ["Which is best for repeating the same action a fixed number of times?","A repeat loop",["A repeat loop","A password","A URL","A slide"]]]},
{title:"LEVEL 4 — AI DETECTIVE",type:"mc",qs:[
 ["An AI sees many examples of cats and dogs and learns patterns. What is happening?","Data-driven learning",["Data-driven learning","A fixed alarm","Manual typing","Screen brightness"]],
 ["An AI gives a prediction. What should a person do before trusting an important decision?","Check and verify the result",["Check and verify the result","Always accept it","Delete the data","Ignore the evidence"]],
 ["AI can help find options, but who should make the final important decision?","People",["People","The algorithm alone","The keyboard","The timer"]]]},
{title:"LEVEL 5 — ML vs DL",type:"mc",qs:[
 ["Machine Learning mainly means systems learn patterns from…","data and examples",["data and examples","only fixed instructions","a stopwatch","a printer"]],
 ["Deep Learning is a type of…","Machine Learning",["Machine Learning","web browser","spreadsheet","network cable"]],
 ["Which statement is safest about AI?","AI can be useful but its outputs need checking",["AI can be useful but its outputs need checking","AI is always correct","AI never needs data","AI replaces every human decision"]]]}
];

let level=0,q=0,score=0,timer=30,interval,locked=false;
function startGame(){document.getElementById('home').classList.remove('active');document.getElementById('game').classList.add('active');level=0;q=0;score=0;render();}
function render(){
 locked=false;clearInterval(interval);timer=30;document.getElementById('timer').textContent=timer;
 document.getElementById('score').textContent=score;document.getElementById('levelTitle').textContent=levels[level].title;
 document.getElementById('feedback').textContent="";document.getElementById('next').style.display="none";
 document.getElementById('progress').style.width=((q/(level===0?1:3))*100)+"%";
 document.getElementById('levelbar').innerHTML=levels.map((_,i)=>`<div class="dot ${i<level?'done':i===level?'now':''}"></div>`).join('');
 const L=levels[level], play=document.getElementById('play');
 if(L.type==="order"){document.getElementById('question').textContent="Put the steps in a logical order.";play.innerHTML=`<div class="dragarea" id="steps">${shuffle(L.items).map((x,i)=>`<div class="step" data-i="${i}" onclick="selectStep(this)">${x[0]} — ${x[1]}</div>`).join('')}</div><br><button class="btn" onclick="checkOrder()">CHECK ORDER ✓</button>`;}
 else if(L.type==="loop") renderMC(L.qs[q]);
 else renderMC(L.qs[q]);
 if(L.type!=="order") startTimer();
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function selectStep(el){if(locked)return;document.querySelectorAll('.step').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function checkOrder(){
 if(locked)return;let els=[...document.querySelectorAll('.step')];let labels=els.map(e=>e.textContent.split(" — ")[0]);let correct=levels[0].items.map(x=>x[0]);let ok=labels.every((x,i)=>x===correct[i]);finish(ok,10);
}
function renderMC(data){document.getElementById('question').textContent=data[0];document.getElementById('play').innerHTML=`<div class="options">${data[2].map(x=>`<button class="opt" onclick="answer(this,'${escapeQ(x)}','${escapeQ(data[1])}')">${x}</button>`).join('')}</div>`}
function escapeQ(s){return s.replace(/'/g,"&#39;")}
function answer(btn,a,c){if(locked)return;finish(a===c,10);btn.classList.add(a===c?'correct':'wrong');}
function finish(ok,pts){
 locked=true;clearInterval(interval);if(ok){score+=pts;document.getElementById('feedback').textContent="✨ Excellent! Your algorithm works!";}else document.getElementById('feedback').textContent="💡 Oops! Check the idea again.";
 document.getElementById('score').textContent=score;document.getElementById('next').style.display="inline-block";
}
function startTimer(){interval=setInterval(()=>{timer--;document.getElementById('timer').textContent=timer;if(timer<=0){clearInterval(interval);if(!locked)finish(false,0)}},1000)}
function nextQuestion(){
 const L=levels[level]; if(level===0){level++;q=0;render();return}
 q++;if(q>=L.qs.length){level++;q=0;if(level>=levels.length){showResult();return}}render();
}
function showResult(){
 document.getElementById('game').classList.remove('active');document.getElementById('result').classList.add('active');
 document.getElementById('finalScore').textContent=score+"/50";
 let s=score>=45?"⭐⭐⭐":score>=30?"⭐⭐":"⭐";document.getElementById('stars').textContent=s;
 let r=score>=45?"AI ALGORITHM MASTER 🤖":score>=30?"AI EXPLORER 🚀":"KEEP PRACTICING 💪";
 document.getElementById('rank').textContent=r;
 document.getElementById('message').textContent=score>=45?"Outstanding reasoning! You understand how algorithms and AI use data and patterns.":score>=30?"Great job! Keep practicing logical reasoning and checking AI results.":"Every challenge makes your algorithm thinking stronger!";
}
</script>
</body>
</html>
